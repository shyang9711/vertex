name: Build & Release Windows EXE

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
          
      - name: Debug icon file
        run: |
          dir
          dir logo.ico
      - name: Build EXE
        run: >
          pyinstaller --onefile --noconsole --icon=logo.ico
          --hidden-import=fitz
          --hidden-import=pymupdf
          --hidden-import colorama `
          --hidden-import PyPDF2 `
          --hidden-import pdfminer `
          --hidden-import pdfminer.six `
          --collect-all=pymupdf
          --collect-all=sqlcipher3
          --collect-all=keyring
          --hidden-import=sqlcipher3
          --hidden-import=sqlcipher3.dbapi2
          --hidden-import=keyring.backends.Windows
          --hidden-import=keyring.backends.null
          --hidden-import=utils.db_crypto
          --hidden-import=ui.dialogs.db_password_dialog
          --add-data "logo.ico;."
          --add-data "scripts.json;."
          --add-data "features/pos_parse.py;features"
          --add-data "features/validate_tax_payments.py;features"
          --add-data "features/file_name_change.py;features"
          --add-data "features/de9c_to_csv.py;features"
          --add-data "features/vendor_match/vendor_match.py;features/vendor_match"
          --add-data "features/vendor_match/bank_of_america/parse_bofa_debits.py;features/vendor_match/bank_of_america"
          --add-data "features/vendor_match/bank_of_america/__init__.py;features/vendor_match/bank_of_america"
          --add-data "features/vendor_match/citi/parse_citi_checking.py;features/vendor_match/citi"
          --add-data "features/vendor_match/citi/__init__.py;features/vendor_match/citi"
          --add-data "features/vendor_match/fremont/parse_fremont_checking.py;features/vendor_match/fremont"
          --add-data "features/vendor_match/fremont/__init__.py;features/vendor_match/fremont"
          --add-data "features/vendor_match/comerica/parse_comerica_checking.py;features/vendor_match/comerica"
          --add-data "features/vendor_match/comerica/__init__.py;features/vendor_match/comerica"
          --add-data "features/vendor_match/us_bank/parse_us_bank_checking.py;features/vendor_match/us_bank"
          --add-data "features/vendor_match/us_bank/parse_us_bank_cc.py;features/vendor_match/us_bank"
          --add-data "features/vendor_match/us_bank/__init__.py;features/vendor_match/us_bank"
          --add-data "features/vendor_match/capital_one/parse_capital_one_cc.py;features/vendor_match/capital_one"
          --add-data "features/vendor_match/capital_one/__init__.py;features/vendor_match/capital_one"
          --add-data "features/vendor_match/__init__.py;features/vendor_match"
          --name vertex
          client_manager.py
          
      - name: Generate update_policy.json
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $ver = $tag.TrimStart("v")
          $isMajor = $ver.EndsWith("f")

          $policy = @{
            min_required_version = $ver
            latest_version       = $ver
            message              = $(if ($isMajor) { "Update required to continue." } else { "Update available." })
            force                = $isMajor
          } | ConvertTo-Json

          $policy | Out-File -Encoding utf8 update_policy.json
          Write-Host "Tag=$tag Version=$ver force=$isMajor"
          Get-Content update_policy.json

      - name: Verify EXE
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/vertex.exe")) {
            throw "dist/vertex.exe was not built"
          }
          Get-Item "dist/vertex.exe" | Format-List FullName, Length, LastWriteTime

      - name: Keep EXE as workflow artifact
        uses: actions/upload-artifact@v5
        with:
          name: vertex-exe
          path: dist/vertex.exe
          if-no-files-found: error

      - name: Upload EXE to GitHub Release
        id: gh_release
        continue-on-error: true
        uses: softprops/action-gh-release@v3
        with:
          files: dist/vertex.exe
          fail_on_unmatched_files: true
          overwrite_files: true

      - name: Retry EXE upload with gh
        if: steps.gh_release.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          Start-Sleep -Seconds 8
          gh release upload "${{ github.ref_name }}" "dist/vertex.exe" --clobber
